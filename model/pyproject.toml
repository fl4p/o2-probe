[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "o2-probe-lumped-model"
version = "0.1.0"
description = "Calibratable lumped transport model for the Rev-A compost oxygen probe"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.10",
  "scipy>=1.14",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.scripts]
o2-lumped = "o2_lumped.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
