<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1080"
     viewBox="0 0 1100 1080" role="img"
     aria-labelledby="title desc">
  <title id="title">O2 probe Rev-A PCB outline and SGX-OX-ROHS-Mini footprint draft</title>
  <desc id="desc">Dimensioned top view of the 20 by 125 millimetre PCB and an enlarged sensor footprint detail. Dimensions are provisional and must be checked against a physical sensor and enclosure.</desc>

  <defs>
    <style>
      .page { fill: #f8fafc; }
      .board { fill: #e7f5ec; stroke: #153c2c; stroke-width: 3; }
      .potted { fill: #dceafe; }
      .transition { fill: #fff2c7; }
      .gas { fill: #e7f5ec; }
      .reserve { fill: none; stroke: #b45309; stroke-width: 2.5; stroke-dasharray: 8 6; }
      .cell { fill: #d8dee7; stroke: #263244; stroke-width: 3; }
      .port { fill: #f8fafc; stroke: #263244; stroke-width: 2.5; }
      .pad { fill: #d5a928; stroke: #59420b; stroke-width: 2; }
      .datum { stroke: #c2413b; stroke-width: 3; stroke-dasharray: 10 6; }
      .centre { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .ext { stroke: #64748b; stroke-width: 1.5; }
      .dim { fill: none; stroke: #1d4ed8; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .leader { fill: none; stroke: #334155; stroke-width: 1.8; marker-end: url(#leaderArrow); }
      .title { font: 700 28px system-ui, sans-serif; fill: #172033; }
      .subtitle { font: 500 15px system-ui, sans-serif; fill: #536174; }
      .head { font: 700 18px system-ui, sans-serif; fill: #172033; }
      .label { font: 600 14px system-ui, sans-serif; fill: #243247; }
      .small { font: 500 12px system-ui, sans-serif; fill: #536174; }
      .dimension { font: 700 14px system-ui, sans-serif; fill: #1d4ed8; }
      .warning { fill: #fff8dd; stroke: #ca8a04; stroke-width: 1.5; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="leaderArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <clipPath id="boardClip">
      <rect x="300" y="150" width="128" height="800" rx="13"/>
    </clipPath>
  </defs>

  <rect class="page" width="1100" height="1080"/>
  <text class="title" x="55" y="55">O₂ probe PCB — Rev-A outline / footprint draft</text>
  <text class="subtitle" x="55" y="82">Component-side view · dimensions in mm · cable end at y=0 · probe tip at y=125</text>

  <!-- Full-board top view; scale 6.4 px/mm. -->
  <text class="head" x="235" y="120">Board datum</text>
  <g clip-path="url(#boardClip)">
    <rect class="potted" x="300" y="150" width="128" height="524.8"/>
    <rect class="transition" x="300" y="674.8" width="128" height="25.6"/>
    <rect class="gas" x="300" y="700.4" width="128" height="249.6"/>
  </g>
  <rect class="board" x="300" y="150" width="128" height="800" rx="13" fill-opacity="0.28"/>

  <!-- Board centre and controlled regions. -->
  <line class="centre" x1="364" y1="140" x2="364" y2="960"/>
  <line class="datum" x1="300" y1="674.8" x2="428" y2="674.8"/>
  <text class="label" x="314" y="666">POT TO HERE · y=82</text>
  <text class="small" x="315" y="694">transition to y=86</text>

  <rect class="reserve" x="306.4" y="700.4" width="115.2" height="140.8" rx="10"/>
  <text class="small" x="450" y="704">heater-island reserve</text>
  <text class="small" x="450" y="720">x=1…19, y=86…108</text>

  <!-- Sensor at centre (10,93.5), body diameter 14.4. -->
  <circle class="cell" cx="364" cy="748.4" r="46.08"/>
  <circle class="port" cx="364" cy="748.4" r="8"/>
  <circle class="pad" cx="347.744" cy="732.4" r="3.2"/>
  <circle class="pad" cx="364" cy="732.4" r="3.2"/>
  <circle class="pad" cx="380.256" cy="732.4" r="3.2"/>
  <line class="centre" x1="310" y1="748.4" x2="418" y2="748.4"/>
  <line class="centre" x1="364" y1="694.4" x2="364" y2="802.4"/>
  <path class="leader" d="M 452 786 L 408 778"/>
  <text class="label" x="457" y="790">SGX body Ø14.4</text>
  <text class="small" x="457" y="808">centre (10,93.5)</text>
  <path class="leader" d="M 477 836 L 374 754"/>
  <text class="small" x="482" y="842">D_PORT=2.5 placeholder</text>

  <!-- Functional placement bands. -->
  <rect class="reserve" x="306.4" y="150" width="115.2" height="51.2" rx="5"/>
  <text class="small" x="442" y="175">cable pads y=0…8</text>
  <rect class="reserve" x="306.4" y="892.4" width="115.2" height="44.8" rx="5"/>
  <text class="small" x="442" y="916">Tgas tab y=116…123</text>
  <text class="label" x="315" y="420">POTTED</text>
  <text class="label" x="334" y="870">GAS</text>

  <!-- Overall board dimensions. -->
  <line class="ext" x1="300" y1="150" x2="300" y2="110"/>
  <line class="ext" x1="428" y1="150" x2="428" y2="110"/>
  <line class="dim" x1="300" y1="120" x2="428" y2="120"/>
  <text class="dimension" x="364" y="108" text-anchor="middle">20.0</text>

  <line class="ext" x1="300" y1="150" x2="246" y2="150"/>
  <line class="ext" x1="300" y1="950" x2="246" y2="950"/>
  <line class="dim" x1="258" y1="150" x2="258" y2="950"/>
  <text class="dimension" x="243" y="550" text-anchor="middle" transform="rotate(-90 243 550)">125.0</text>

  <line class="ext" x1="300" y1="150" x2="278" y2="150"/>
  <line class="ext" x1="300" y1="674.8" x2="278" y2="674.8"/>
  <line class="dim" x1="285" y1="150" x2="285" y2="674.8"/>
  <text class="dimension" x="281" y="412" text-anchor="middle" transform="rotate(-90 281 412)">82.0 pot datum</text>

  <!-- Enlarged cell footprint detail; scale 20 px/mm. -->
  <text class="head" x="635" y="120">SGX-OX-ROHS-Mini footprint detail</text>
  <text class="small" x="635" y="143">Enlarged 20×; pin row points toward cable / AFE</text>
  <circle class="cell" cx="780" cy="390" r="144"/>
  <circle class="port" cx="780" cy="390" r="25"/>
  <line class="centre" x1="616" y1="390" x2="944" y2="390"/>
  <line class="centre" x1="780" y1="226" x2="780" y2="554"/>

  <!-- Datasheet pin centres: 2.54 pitch, row 2.50 from centre. -->
  <circle class="pad" cx="729.2" cy="340" r="9"/>
  <circle class="pad" cx="780" cy="340" r="9"/>
  <circle class="pad" cx="830.8" cy="340" r="9"/>
  <text class="small" x="729.2" y="321" text-anchor="middle">C</text>
  <text class="small" x="780" y="321" text-anchor="middle">R</text>
  <text class="small" x="830.8" y="321" text-anchor="middle">W</text>

  <!-- Diameter callout. -->
  <line class="dim" x1="636" y1="390" x2="924" y2="390"/>
  <rect x="744" y="376" width="72" height="24" rx="4" fill="#f8fafc"/>
  <text class="dimension" x="780" y="393" text-anchor="middle">Ø14.40</text>

  <!-- Pin pitch dimensions. -->
  <line class="ext" x1="729.2" y1="349" x2="729.2" y2="590"/>
  <line class="ext" x1="780" y1="349" x2="780" y2="590"/>
  <line class="ext" x1="830.8" y1="349" x2="830.8" y2="590"/>
  <line class="dim" x1="729.2" y1="575" x2="780" y2="575"/>
  <line class="dim" x1="780" y1="575" x2="830.8" y2="575"/>
  <text class="dimension" x="754.6" y="566" text-anchor="middle">2.54</text>
  <text class="dimension" x="805.4" y="566" text-anchor="middle">2.54</text>

  <!-- Pin row offset. -->
  <line class="ext" x1="845" y1="340" x2="880" y2="340"/>
  <line class="ext" x1="845" y1="390" x2="880" y2="390"/>
  <line class="dim" x1="868" y1="340" x2="868" y2="390"/>
  <text class="dimension" x="885" y="369">2.50</text>

  <!-- Port and pin notes. -->
  <path class="leader" d="M 990 390 L 807 390"/>
  <text class="label" x="938" y="376">rear gas port</text>
  <text class="small" x="938" y="408">Ø2.5 draft placeholder</text>
  <text class="small" x="938" y="426">measure before release</text>

  <path class="leader" d="M 978 285 L 837 335"/>
  <text class="small" x="930" y="265">pin Ø0.64</text>
  <text class="small" x="930" y="282">pad / annulus TBD</text>

  <!-- Board location inset. -->
  <rect x="620" y="625" width="430" height="230" rx="14" fill="#eef3f8" stroke="#cbd5e1"/>
  <text class="head" x="645" y="658">Controlled placement dimensions</text>
  <text class="label" x="650" y="696">Board</text>
  <text class="small" x="785" y="696">20.0 × 125.0 · corner R2.0</text>
  <text class="label" x="650" y="726">Pot datum</text>
  <text class="small" x="785" y="726">y=82.0 · transition ends y=86.0</text>
  <text class="label" x="650" y="756">Cell centre</text>
  <text class="small" x="785" y="756">x=10.0, y=93.5</text>
  <text class="label" x="650" y="786">Cell body</text>
  <text class="small" x="785" y="786">Ø14.40 · datasheet tolerance ±0.15</text>
  <text class="label" x="650" y="816">Pin pattern</text>
  <text class="small" x="785" y="816">2.54 pitch · row offset 2.50 · pin Ø0.64</text>

  <rect class="warning" x="620" y="880" width="430" height="92" rx="12"/>
  <text class="label" x="642" y="910">DRAFT — DO NOT FABRICATE FROM THIS DRAWING</text>
  <text class="small" x="642" y="936">Rear-port diameter, pad annuli, routed-slot endpoints, heater neck,</text>
  <text class="small" x="642" y="955">and assembled tube-chord clearance require physical verification.</text>

  <text class="small" x="55" y="1035">Source: o2-probe/PLAN.md · SGX DS-0637 Issue 1 · drawing generated 2026-08-18</text>
</svg>
