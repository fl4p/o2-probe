          - generic [ref=f21e99]:
            - heading "Allgemeinzuteilungen" [level=1] [ref=f21e100]
            - paragraph [ref=f21e102]: Frequenzen werden in der Regel von Amts wegen als Allgemeinzuteilungen durch die Bundesnetzagentur für die Nutzung durch die Allgemeinheit oder einen nach allgemeinen Merkmalen bestimmten oder bestimmbaren Personenkreis zugeteilt (gem. § 91 Abs. 2 TKG). Die Allgemeinzuteilungen werden veröffentlicht.
            - generic [ref=f21e103]:
              - list
              - paragraph [ref=f21e104]:
                - text: Allgemeinzuteilungen sind nur dann möglich, wenn durch die somit nutzbar gemachten Anwendungen keine Gefahr von funktechnischen Störungen ausgeht und sie nicht der Sicherstellung einer effizienten Frequenznutzung widersprechen (
                - generic "gemäß" [ref=f21e105]:
                  - generic "gemäß" [ref=f21e106]:
                    - generic "gemäß" [ref=f21e107]:
                      - generic "gemäß" [ref=f21e108]:
                        - generic "gemäß" [ref=f21e109]:
                          - generic "gemäß" [ref=f21e110]: gem.
                - text: § 91
                - generic "Absatz" [ref=f21e111]:
                  - generic "Absatz" [ref=f21e112]:
                    - generic "Absatz" [ref=f21e113]:
                      - generic "Absatz" [ref=f21e114]:
                        - generic "Absatz" [ref=f21e115]:
                          - generic "Absatz" [ref=f21e116]: Abs.
                - text: "3"
                - generic "Telekommunikationsgesetz" [ref=f21e117]:
                  - generic "Telekommunikationsgesetz" [ref=f21e118]:
                    - generic "Telekommunikationsgesetz" [ref=f21e119]:
                      - generic "Telekommunikationsgesetz" [ref=f21e120]:
                        - generic "Telekommunikationsgesetz" [ref=f21e121]:
                          - generic "Telekommunikationsgesetz" [ref=f21e122]: TKG
                - text: ). Bei Allgemeinzuteilungen sind außerdem eine Mengenbetrachtung und detaillierte Kenntnisse über die Frequenzauslastung ausgeschlossen. Eine technische Koordinierung (Frequenz- und Standortkoordinierung) von Frequenznutzungen unter Berücksichtigung der regionalen Kapazitäten ist deshalb nur im Rahmen von Einzelzuteilungen möglich.
              - heading "Allgemeinzuteilung von Frequenzen zur Nutzung durch Geräte geringer Reichweite (SRD)" [level=2] [ref=f21e123]
              - paragraph [ref=f21e124]:
                - text: Die Allgemeinzuteilung von Frequenzen zur Nutzung durch Geräte geringer Reichweite (
