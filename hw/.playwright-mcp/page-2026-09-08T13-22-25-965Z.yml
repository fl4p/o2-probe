              - heading "Drahtlose Mikrofone u.ä. Anwendungen" [level=3] [ref=f21e164]
              - paragraph [ref=f21e165]: Drahtlose PMSE-Audioausrüstungen sind Funkanlagen zur Übertragung analoger und digitaler Audiosignale zwischen einer begrenzten Anzahl von Sende- und Empfangsgeräten, wie Funkmikrofonen, In-Ear-Monitoring Systemen oder Audio-Links, die vor allem für die Herstellung von Rundfunkprogrammen oder bei privaten oder öffentlichen gesellschaftlichen oder kulturellen Veranstaltungen eingesetzt werden.
