                - text: ) (
                - generic "Verfügung" [ref=f21e130]:
                  - generic "Verfügung" [ref=f21e131]:
                    - generic "Verfügung" [ref=f21e132]:
                      - generic "Verfügung" [ref=f21e133]:
                        - generic "Verfügung" [ref=f21e134]: Vfg.
                - text: 91/2025) teilt bestimmte Frequenzen zur Nutzung durch die Allgemeinheit für Funkanwendungen (Geräte) geringer Reichweite zu, welche bisher durch separate Allgemeinzuteilungen zugeteilt wurden.
              - link "Allgemeinzuteilung von Frequenzen zur Nutzung durch Geräte geringer Reichweite (SRD) (Vfg. 91/2025) (pdf / 399 KB)" [ref=f21e136] [cursor=pointer]:
