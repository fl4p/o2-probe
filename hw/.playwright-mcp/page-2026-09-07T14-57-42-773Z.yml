09\\/T-ED.1982.20698\",\"volume\":\"29\",\"author\":\"Arora\",\"year\":\"1982\",\"journal-title\":\"IEEE Trans. Electron Devices\",\"ISSN\":\"http:\\/\\/id.crossref.org\\/issn\\/0018-9383\",\"issn-type\":\"print\"},{\"key\":\"10.1149\\/1.1413993_r38\",\"doi-asserted-by\":\"crossref\",\"first-page\":\"1025\",\"DOI\":\"10.1063\\/1.97460\",\"volume\":\"49\",\"author\":\"Fortunato\",\"year\":\"1986\",\"journal-title\":\"Appl. Phys. Lett.\",\"ISSN\":\"http:\\/\\/id.crossref.org\\/issn\\/0003-6951\",\"issn-type\":\"print\"},{\"key\":\"10.1149\\/1.1413993_r39\",\"doi-asserted-by\":\"crossref\",\"unstructured\":\"M. Rydberg, U. Smith, and H. Sjo\\u0308din, J. Vac. Sci. Technol. B, March-April 2000, 690.\",\"DOI\":\"10.1116\\/1.591260\"},{\"key\":\"10.1149\\/1.1413993_r40\",\"doi-asserted-by\":\"crossref\",\"unstructured\":\"T. I. Kamins,Polycrystalline Silicon for Integrated Circuits and Displays, 2nd ed., Kluwer Academic Publishers, Dordrecht, The Netherlands (1998).\",\"DOI\":\"10.1007\\/978-1-4615-5577-3\"},{\"key\":\"10.1149\\/1.1413993_r41\",\"doi-asserted-by\":\"crossref\",\"first-page\":\"5247\",\"DOI\":\"10.1063\\/1.321593\",\"volume\":\"46\",\"author\":\"Seto\",\"year\":\"1975\",\"journal-title\":\"J. Appl. Phys.\",\"ISSN\":\"http:\\/\\/id.crossref.org\\/issn\\/0021-8979\",\"issn-type\":\"print\"}],\"container-title\":[\"Journal of The Electrochemical Society\"],\"language\":\"en\",\"link\":[{\"URL\":\"https:\\/\\/syndication.highwire.org\\/content\\/doi\\/10.1149\\/1.1413993\",\"content-type\":\"unspecified\",\"content-version\":\"vor\",\"intended-application\":\"similarity-checking\"}],\"deposited\":{\"date-parts\":[[2020,2,7]],\"date-time\":\"2020-02-07T20:33:28Z\",\"timestamp\":1581107608000},\"score\":27.015465,\"resource\":{\"primary\":{\"URL\":\"https:\\/\\/iopscience.iop.org\\/article\\/10.1149\\/1.1413993\"}},\"issued\":{\"date-parts\":[[2001]]},\"references-count\":41,\"journal-issue\":{\"issue\":\"12\",\"published-print\":{\"date-parts\":[[2001]]}},\"URL\":\"https:\\/\\/doi.org\\/10.1149\\/1.1413993\",\"ISSN\":[\"0013-4651\"],\"issn-type\":[{\"value\":\"0013-4651\",\"type\":\"print\"}],\"published\":{\"date-parts\":[[2001]]}},{\"indexed\":{\"date-parts\":[[2026,5,12]],\"date-time\":\"2026-05-12T03:14:30Z\",\"timestamp\":1778555670702,\"version\":\"3.51.4\"},\"posted\":{\"date-parts\":[[2026]]},\"group-title\":\"SSRN\",\"reference-count\":0,\"publisher\":\"Elsevier BV\",\"content-domain\":{\"domain\":[],\"crossmark-restriction\":false},\"abstract\":\"<jats:p>Monitoring environmental oxygen concentrations is crucial for ensuring air quality and workplace safety, for example in confined space operations or underground mining. Miniaturized oxygen gas sensors offer promising advantages in terms of cost, portability and suitability for distributed sensing networks. Here, we report a wafer-scale fabricated electrochemical oxygen sensor based on miniaturized planar electrodes and a room-temperature ionic liquid (RTIL) as electrolyte. Using this method, a silicon-based microchip was created containing a regular pattern of silicon oxide micropillars that cover the entire active area of the chip. The micropillar array confined and stabilized a thin film of RTIL as electrolyte layer, which is critical for achieving sensitive and stabile sensor operation. Using both cyclic voltammetry and chrono-amperometry, we quantified the sensor response and the influence of relative humidity on sensor response, highlighting the need to account for humidity effects during operation under ambient conditions. Baseline drift was significantly reduced by employing double potential amperometry. Furthermore, the sensor shows no measurable cross sensitivity to other major components of ambient air, including CO\\u2082. The presented sensor combines a small form factor with wafer\\u2010scale manufacturability and compatibility with low\\u2010power microelectronics, making it a promising platform for low\\u2010cost, integrated oxygen sensing applica