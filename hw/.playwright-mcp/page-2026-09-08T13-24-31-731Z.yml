      - generic [ref=f30e415]:
        - generic [ref=f30e416]:
          - heading "Querying basics" [level=1] [ref=f30e417]
          - generic [ref=f30e418]:
            - paragraph [ref=f30e419]: Prometheus provides a functional query language called PromQL (Prometheus Query Language) that lets the user select and aggregate time series data in real time.
            - paragraph [ref=f30e420]:
              - text: When you send a query request to Prometheus, it can be an
              - emphasis [ref=f30e421]: instant query
              - text: ", evaluated at one point in time, or a"
              - emphasis [ref=f30e422]: range query
              - text: at equally-spaced steps between a start and an end time. PromQL works exactly the same in each case; the range query is just like an instant query run multiple times at different timestamps.
            - paragraph [ref=f30e423]: In the Prometheus UI, the "Table" tab is for instant queries and the "Graph" tab is for range queries.
            - paragraph [ref=f30e424]:
              - text: Other programs can fetch the result of a PromQL expression via the
              - link "HTTP API" [ref=f30e425] [cursor=pointer]:
                - /url: /docs/prometheus/latest/querying/api/
              - text: .
            - heading "Examples" [level=2] [ref=f30e426]:
              - text: Examples
              - link [ref=f30e427] [cursor=pointer]:
                - /url: "#examples"
            - paragraph [ref=f30e432]:
              - text: This document is a Prometheus basic language reference. For learning, it may be easier to start with a couple of
              - link "examples" [ref=f30e433] [cursor=pointer]:
                - /url: /docs/prometheus/latest/querying/examples/
              - text: .
            - heading "Samples" [level=2] [ref=f30e434]:
              - text: Samples
              - link [ref=f30e435] [cursor=pointer]:
                - /url: "#samples"
            - paragraph [ref=f30e440]:
              - text: The value of a sample at a given timestamp returned by PromQL may be a float or a
              - link "native histogram" [ref=f30e441] [cursor=pointer]:
                - /url: /docs/specs/native_histograms/
              - text: . A float sample is a simple floating point number, whereas a native histograms sample contains a full histogram including count, sum, and buckets.
            - paragraph [ref=f30e442]:
              - text: Note that the term “histogram sample” in the PromQL documentation always refers to a native histogram. The term "classic histogram" refers to a set of time series containing float samples with the
              - code [ref=f30e443]: _bucket
              - text: ","
              - code [ref=f30e444]: _count
              - text: ", and"
              - code [ref=f30e445]: _sum
              - text: suffixes that together describe a histogram. From the perspective of PromQL, these contain just float samples, there are no “classic histogram samples”.
            - paragraph [ref=f30e446]:
              - text: Both float samples and histogram samples can have a counter or a gauge “flavor”. Float samples with a counter or gauge flavor are generally simply called “counters” or “gauges”, respectively, while their histogram counterparts are called “counter histograms” or “gauge histograms”. Float samples do not store their flavor, leaving it to the user to take their flavor into account when writing PromQL queries. (By convention, time series containing float counters have a name ending on
              - code [ref=f30e447]: _total
              - text: to help with the distinction.)
            - paragraph [ref=f30e448]:
              - text: Since histogram samples “know” their counter or gauge flavor, this allows reliable warnings about mismatched operations. For example, applying the
              - code [ref=f30e449]: rate
              - text: function to gauge floats will most likely produce a nonsensical result, but the query will be processed without complains. However, if applied to gauge histograms, the result of the query will be annotated with a warning.
            - heading "Expression language data types" [level=2] [ref=f30e450]:
              - text: Expression language data types
              - link [ref=f30e451] [cursor=pointer]:
                - /url: "#expression-language-data-types"
            - paragraph [ref=f30e456]: "In Prometheus's expression language, an expression or sub-expression can evaluate to one of four types:"
            - list [ref=f30e457]:
              - listitem [ref=f30e458]:
                - strong [ref=f30e459]: Instant vector
                - text: "- a set of time series containing a single sample for each time series, all sharing the same timestamp"
              - listitem [ref=f30e460]:
                - strong [ref=f30e461]: Range vector
                - text: "- a set of time series containing a range of data points over time for each time series"
              - listitem [ref=f30e462]:
                - strong [ref=f30e463]: Scalar
                - text: "- a simple numeric floating point value"
              - listitem [ref=f30e464]:
                - strong [ref=f30e465]: String
                - text: "- a simple string value; currently unused"
            - paragraph [ref=f30e466]:
              - text: Depending on the use case (e.g. when graphing vs. displaying the output of an expression), only some of these types are legal as the result of a user-specified expression. For
              - link "instant queries" [ref=f30e467] [cursor=pointer]:
                - /url: /docs/prometheus/latest/querying/api/#instant-queries
              - text: ", any of the above data types are allowed as the root of the expression."
              - link "Range queries" [ref=f30e468] [cursor=pointer]:
                - /url: /docs/prometheus/latest/querying/api/#range-queries
              - text: only support scalar-typed and instant-vector-typed expressions.
            - paragraph [ref=f30e469]: Both vectors and time series may contain a mix of float samples and histogram samples.
            - heading "Reconciliation of histogram bucket layouts" [level=2] [ref=f30e470]:
              - text: Reconciliation of histogram bucket layouts
              - link [ref=f30e471] [cursor=pointer]:
                - /url: "#reconciliation-of-histogram-bucket-layouts"
            - paragraph [ref=f30e476]: Native histograms can have different bucket layouts, but they are generally convertible to compatible versions to apply binary and aggregation operations to them. Functions acting on range vectors that are applicable to native histograms also perform such reconciliation. In binary operations this reconciliation is performed pairwise, in aggregation operations and functions all histogram samples are reconciled to one compatible bucket layout.
            - paragraph [ref=f30e477]:
              - text: Not all bucket layouts can be reconciled, if incompatible histograms are encountered in an operation, the corresponding output vector element is removed from the result, flagged with a warn-level annotation. More details can be found in the
              - link "native histogram specification" [ref=f30e478] [cursor=pointer]:
                - /url: /docs/specs/native_histograms/#compatibility-between-histograms
              - text: .
            - heading "Literals" [level=2] [ref=f30e479]:
              - text: Literals
              - link [ref=f30e480] [cursor=pointer]:
                - /url: "#literals"
            - paragraph [ref=f30e485]: The following section describes literal values of various kinds. Note that there is no “histogram literal”.
            - heading "String literals" [level=3] [ref=f30e486]:
              - text: String literals
              - link [ref=f30e487] [cursor=pointer]:
                - /url: "#string-literals"
            - paragraph [ref=f30e492]: String literals are designated by single quotes, double quotes or backticks.
            - paragraph [ref=f30e493]:
              - text: PromQL follows the same
              - link "escaping rules as Go" [ref=f30e494] [cursor=pointer]:
                - /url: https://golang.org/ref/spec#String_literals
              - text: . For string literals in single or double quotes, a backslash begins an escape sequence, which may be followed by
              - code [ref=f30e500]: a
              - text: ","
              - code [ref=f30e501]: b
              - text: ","
              - code [ref=f30e502]: f
              - text: ","
              - code [ref=f30e503]: "n"
              - text: ","
              - code [ref=f30e504]: r
              - text: ","
              - code [ref=f30e505]: t
              - text: ","
              - code [ref=f30e506]: v
              - text: or
              - code [ref=f30e507]: \
              - text: . Specific characters can be provided using octal (
              - code [ref=f30e508]: \nnn
              - text: ) or hexadecimal (
              - code [ref=f30e509]: \xnn
              - text: ","
              - code [ref=f30e510]: \unnnn
              - text: and
              - code [ref=f30e511]: \Unnnnnnnn
              - text: ) notations.
            - paragraph [ref=f30e512]: Conversely, escape characters are not parsed in string literals designated by backticks. It is important to note that, unlike Go, Prometheus does not discard newlines inside backticks.
            - paragraph [ref=f30e513]: "Example:"
            - code [ref=f30e515]: "\"this is a string\" 'these are unescaped: \\n \\\\ \\t' `these are not unescaped: \\n ' \" \\t`"
            - heading "Float literals and time durations" [level=3] [ref=f30e516]:
              - text: Float literals and time durations
              - link [ref=f30e517] [cursor=pointer]:
                - /url: "#float-literals-and-time-durations"
            - paragraph [ref=f30e522]: "Scalar float values can be written as literal integer or floating-point numbers in the format (whitespace only included for better readability):"
            - code [ref=f30e524]: "[-+]?( [0-9]*\\.?[0-9]+([eE][-+]?[0-9]+)? | 0[xX][0-9a-fA-F]+ | [nN][aA][nN] | [iI][nN][fF] )"
            - paragraph [ref=f30e525]: "Examples:"
            - code [ref=f30e527]: 23 -2.43 3.4e-9 0x8f -Inf NaN
            - paragraph [ref=f30e528]:
              - text: Additionally, underscores (
              - code [ref=f30e529]: _
              - text: ) can be used in between decimal or hexadecimal digits to improve readability.
            - paragraph [ref=f30e530]: "Examples:"
            - code [ref=f30e532]: 1_000_000 .123_456_789 0x_53_AB_F3_82
            - paragraph [ref=f30e533]: "Float literals are also used to specify durations in seconds. For convenience, decimal integer numbers may be combined with the following time units:"
            - list [ref=f30e534]:
              - listitem [ref=f30e535]:
                - code [ref=f30e536]: ms
                - text: – milliseconds
              - listitem [ref=f30e537]:
                - code [ref=f30e538]: s
                - text: – seconds – 1s equals 1000ms
              - listitem [ref=f30e539]:
                - code [ref=f30e540]: m
                - text: – minutes – 1m equals 60s (ignoring leap seconds)
              - listitem [ref=f30e541]:
                - code [ref=f30e542]: h
                - text: – hours – 1h equals 60m
              - listitem [ref=f30e543]:
                - code [ref=f30e544]: d
                - text: – days – 1d equals 24h (ignoring so-called daylight saving time)
              - listitem [ref=f30e545]:
                - code [ref=f30e546]: w
                - text: – weeks – 1w equals 7d
              - listitem [ref=f30e547]:
                - code [ref=f30e548]: "y"
                - text: – years – 1y equals 365d (ignoring leap days)
            - paragraph [ref=f30e549]: Suffixing a decimal integer number with one of the units above is a different representation of the equivalent number of seconds as a bare float literal.
            - paragraph [ref=f30e550]: "Examples:"
            - code [ref=f30e552]: "1s # Equivalent to 1. 2m # Equivalent to 120. 1ms # Equivalent to 0.001. -2h # Equivalent to -7200."
            - paragraph [ref=f30e553]:
              - text: The following examples do
              - emphasis [ref=f30e554]: not
              - text: "work:"
            - code [ref=f30e556]: "0xABm # No suffixing of hexadecimal numbers. 1.5h # Time units cannot be combined with a floating point. +Infd # No suffixing of ±Inf or NaN."
            - paragraph [ref=f30e557]: Multiple units can be combined by concatenation of suffixed integers. Units must be ordered from the longest to the shortest. A given unit must only appear once per float literal.
            - paragraph [ref=f30e558]: "Examples:"
            - code [ref=f30e560]: "1h30m # Equivalent to 5400s and thus 5400. 12h34m56s # Equivalent to 45296s and thus 45296. 54s321ms # Equivalent to 54.321."
            - heading "Duration expressions" [level=3] [ref=f30e561]:
              - text: Duration expressions
              - link [ref=f30e562] [cursor=pointer]:
                - /url: "#duration-expressions"
            - paragraph [ref=f30e567]:
              - text: Arithmetic expressions can be used wherever a time duration is expected, that is in
              - link "range vector selectors" [ref=f30e568] [cursor=pointer]:
                - /url: "#range-vector-selectors"
              - text: and in
              - link "offset durations" [ref=f30e569] [cursor=pointer]:
                - /url: "#offset-modifier"
              - text: .
            - paragraph [ref=f30e570]: "In range vectors:"
            - code [ref=f30e572]: "rate(http_requests_total[5m * 2]) # 10 minute range rate(http_requests_total[(5+2) * 1m]) # 7 minute range"
            - paragraph [ref=f30e573]: "In offset durations:"
            - code [ref=f30e575]: "http_requests_total offset (1h / 2) # 30 minute offset http_requests_total offset ((2 ^ 3) * 1m) # 8 minute offset"
            - paragraph [ref=f30e576]:
              - text: When using
              - code [ref=f30e577]: offset
              - text: with a duration expression, you must wrap the expression in parentheses. Without parentheses, only the first duration value is used in the offset calculation.
            - paragraph [ref=f30e578]: "The following operators are supported, following the usual precedence rules:"
            - list [ref=f30e579]:
              - listitem [ref=f30e580]:
                - code [ref=f30e581]: +
                - text: – addition
              - listitem [ref=f30e582]:
                - code [ref=f30e583]: "-"
                - text: – subtraction
              - listitem [ref=f30e584]:
                - code [ref=f30e585]: "*"
                - text: – multiplication
              - listitem [ref=f30e586]:
                - code [ref=f30e587]: /
                - text: – division
              - listitem [ref=f30e588]:
                - code [ref=f30e589]: "%"
                - text: – modulo
              - listitem [ref=f30e590]:
                - code [ref=f30e591]: ^
                - text: – exponentiation
            - paragraph [ref=f30e592]: "The following functions can be used inside duration expressions:"
            - list [ref=f30e593]:
              - listitem [ref=f30e594]:
                - code [ref=f30e595]: step()
                - text: resolves to the step width of a
                - link "range query" [ref=f30e596] [cursor=pointer]:
                  - /url: /docs/prometheus/latest/querying/api/#range-queries
                - text: ", and to"
                - code [ref=f30e597]: 0s
                - text: for an
                - link "instant query" [ref=f30e598] [cursor=pointer]:
                  - /url: /docs/prometheus/latest/querying/api/#instant-queries
                - text: .
              - listitem [ref=f30e599]:
                - code [ref=f30e600]: range()
                - text: resolves to the full range of a range query (end time − start time), and to
                - code [ref=f30e601]: 0s
                - text: for an instant query. This is particularly useful in combination with
                - code [ref=f30e602]: "@ end()"
                - text: to look back over the entire query range, e.g.
                - code [ref=f30e603]: max_over_time(metric[range()] @ end())
                - text: .
              - listitem [ref=f30e604]:
                - code [ref=f30e605]: min_of(<duration>, <duration>)
                - text: returns the smaller of the two durations, which is useful for capping a duration at a maximum value.
              - listitem [ref=f30e606]:
                - code [ref=f30e607]: max_of(<duration>, <duration>)
                - text: returns the larger of the two durations, which is useful for enforcing a minimum value.
            - paragraph [ref=f30e608]:
              - text: For example,
              - code [ref=f30e609]: max_of(step(), 5s)
              - text: ensures the duration is never shorter than
              - code [ref=f30e610]: 5s
              - text: ", while"
              - code [ref=f30e611]: min_of(range(), 1h)
              - text: caps the duration at
              - code [ref=f30e612]: 1h
              - text: .
            - paragraph [ref=f30e613]:
              - strong [ref=f30e614]: Note
              - text: ": Duration expressions are not supported in the"
              - link [ref=f30e615] [cursor=pointer]:
                - /url: "#modifier"
                - code [ref=f30e616]: "@"
                - text: modifier
              - text: .
            - paragraph [ref=f30e617]: "Examples of equivalent durations:"
            - list [ref=f30e618]:
              - listitem [ref=f30e619]:
                - code [ref=f30e620]: 5m * 2
                - text: is equivalent to
                - code [ref=f30e621]: 10m
                - text: or
                - code [ref=f30e622]: 600s
                - text: .
              - listitem [ref=f30e623]:
                - code [ref=f30e624]: 10m - 1m
                - text: is equivalent to
                - code [ref=f30e625]: 9m
                - text: or
                - code [ref=f30e626]: 540s
                - text: .
              - listitem [ref=f30e627]:
                - code [ref=f30e628]: (5+2) * 1m
                - text: is equivalent to
                - code [ref=f30e629]: 7m
                - text: or
                - code [ref=f30e630]: 420s
                - text: .
              - listitem [ref=f30e631]:
                - code [ref=f30e632]: 1h / 2
                - text: is equivalent to
                - code [ref=f30e633]: 30m
                - text: or
                - code [ref=f30e634]: 1800s
                - text: .
              - listitem [ref=f30e635]:
                - code [ref=f30e636]: 4h % 3h
                - text: is equivalent to
                - code [ref=f30e637]: 1h
                - text: or
                - code [ref=f30e638]: 3600s
                - text: .
              - listitem [ref=f30e639]:
                - code [ref=f30e640]: (2 ^ 3) * 1m
                - text: is equivalent to
                - code [ref=f30e641]: 8m
                - text: or
                - code [ref=f30e642]: 480s
                - text: .
              - listitem [ref=f30e643]:
                - code [ref=f30e644]: step() + 1
                - text: is equivalent to the query step width increased by
                - code [ref=f30e645]: 1s
                - text: .
              - listitem [ref=f30e646]:
                - code [ref=f30e647]: max_of(step(), 5s)
                - text: is equivalent to the larger of the query step width and
                - code [ref=f30e648]: 5s
                - text: .
              - listitem [ref=f30e649]:
                - code [ref=f30e650]: min_of(2 * step() + 5s, 5m)
                - text: is equivalent to the smaller of twice the query step increased by
                - code [ref=f30e651]: 5s
                - text: and
                - code [ref=f30e652]: 5m
                - text: .
            - heading "Time series selectors" [level=2] [ref=f30e653]:
              - text: Time series selectors
              - link [ref=f30e654] [cursor=pointer]:
                - /url: "#time-series-selectors"
            - paragraph [ref=f30e659]: These are the basic building-blocks that instruct PromQL what data to fetch.
            - heading "Instant vector selectors" [level=3] [ref=f30e660]:
              - text: Instant vector selectors
              - link [ref=f30e661] [cursor=pointer]:
                - /url: "#instant-vector-selectors"
            - paragraph [ref=f30e666]: Instant vector selectors allow the selection of a set of time series and a single sample value for each at a given timestamp (point in time). In the simplest form, only a metric name is specified, which results in an instant vector containing elements for all time series that have this metric name.
            - paragraph [ref=f30e667]:
              - text: The value returned will be that of the most recent sample at or before the query's evaluation timestamp (in the case of an
              - link "instant query" [ref=f30e668] [cursor=pointer]:
                - /url: /docs/prometheus/latest/querying/api/#instant-queries
              - text: ) or the current step within the query (in the case of a
              - link "range query" [ref=f30e669] [cursor=pointer]:
                - /url: /docs/prometheus/latest/querying/api/#range-queries
              - text: ). The
              - link [ref=f30e670] [cursor=pointer]:
                - /url: "#modifier"
                - code [ref=f30e671]: "@"
                - text: modifier
              - text: allows overriding the timestamp relative to which the selection takes place. Time series are only returned if their most recent sample is less than the
              - link "lookback period" [ref=f30e672] [cursor=pointer]:
                - /url: "#staleness"
              - text: ago.
            - paragraph [ref=f30e673]:
              - text: This example selects all time series that have the
              - code [ref=f30e674]: http_requests_total
              - text: "metric name, returning the most recent sample for each:"
            - code [ref=f30e676]: http_requests_total
            - paragraph [ref=f30e677]:
              - text: It is possible to filter these time series further by appending a comma-separated list of label matchers in curly braces (
              - code [ref=f30e678]: "{}"
              - text: ).
            - paragraph [ref=f30e679]:
              - text: This example selects only those time series with the
              - code [ref=f30e680]: http_requests_total
              - text: metric name that also have the
              - code [ref=f30e681]: job
              - text: label set to
              - code [ref=f30e682]: prometheus
              - text: and their
              - code [ref=f30e683]: group
              - text: label set to
              - code [ref=f30e684]: canary
              - text: ":"
            - code [ref=f30e686]: "http_requests_total{job=\"prometheus\",group=\"canary\"}"
            - paragraph [ref=f30e687]: "It is also possible to negatively match a label value, or to match label values against regular expressions. The following label matching operators exist:"
            - list [ref=f30e688]:
              - listitem [ref=f30e689]:
                - code [ref=f30e690]: =
                - text: ": Select labels that are exactly equal to the provided string."
              - listitem [ref=f30e691]:
                - code [ref=f30e692]: "!="
                - text: ": Select labels that are not equal to the provided string."
              - listitem [ref=f30e693]:
                - code [ref=f30e694]: =~
                - text: ": Select labels that regex-match the provided string."
              - listitem [ref=f30e695]:
                - code [ref=f30e696]: "!~"
                - text: ": Select labels that do not regex-match the provided string."
            - paragraph [ref=f30e697]:
              - link "Regex" [ref=f30e698] [cursor=pointer]:
                - /url: "#regular-expressions"
              - text: matches are fully anchored. A match of
              - code [ref=f30e699]: env=~"foo"
              - text: is treated as
              - code [ref=f30e700]: env=~"^foo$"
              - text: .
            - paragraph [ref=f30e701]:
              - text: For example, this selects all
              - code [ref=f30e702]: http_requests_total
              - text: time series for
              - code [ref=f30e703]: staging
              - text: ","
              - code [ref=f30e704]: testing
              - text: ", and"
              - code [ref=f30e705]: development
              - text: environments and HTTP methods other than
              - code [ref=f30e706]: GET
              - text: .
            - code [ref=f30e708]: "http_requests_total{environment=~\"staging|testing|development\",method!=\"GET\"}"
            - paragraph [ref=f30e709]: Label matchers that match empty label values also select all time series that do not have the specific label set at all. It is possible to have multiple matchers for the same label name.
            - paragraph [ref=f30e710]: "For example, given the dataset:"
            - code [ref=f30e712]: "http_requests_total http_requests_total{replica=\"rep-a\"} http_requests_total{replica=\"rep-b\"} http_requests_total{environment=\"development\"}"
            - paragraph [ref=f30e713]:
              - text: The query
              - code [ref=f30e714]: "http_requests_total{environment=\"\"}"
              - text: "would match and return:"
            - code [ref=f30e716]: "http_requests_total http_requests_total{replica=\"rep-a\"} http_requests_total{replica=\"rep-b\"}"
            - paragraph [ref=f30e717]: "and would exclude:"
            - code [ref=f30e719]: "http_requests_total{environment=\"development\"}"
            - paragraph [ref=f30e720]: Multiple matchers can be used for the same label name; they all must pass for a result to be returned.
            - paragraph [ref=f30e721]: "The query:"
            - code [ref=f30e723]: "http_requests_total{replica!=\"rep-a\",replica=~\"rep.*\"}"
            - paragraph [ref=f30e724]: "Would then match:"
            - code [ref=f30e726]: "http_requests_total{replica=\"rep-b\"}"
            - paragraph [ref=f30e727]: "Vector selectors must either specify a name or at least one label matcher that does not match the empty string. The following expression is illegal:"
            - code [ref=f30e729]: "{job=~\".*\"} # Bad!"
            - paragraph [ref=f30e730]: In contrast, these expressions are valid as they both have a selector that does not match empty label values.
            - code [ref=f30e732]: "{job=~\".+\"} # Good! {job=~\".*\",method=\"get\"} # Good!"
            - paragraph [ref=f30e733]:
              - text: Label matchers can also be applied to metric names by matching against the internal
              - code [ref=f30e734]: __name__
              - text: label. For example, the expression
              - code [ref=f30e735]: http_requests_total
              - text: is equivalent to
              - code [ref=f30e736]: "{__name__=\"http_requests_total\"}"
              - text: . Matchers other than
              - code [ref=f30e737]: =
              - text: (
              - code [ref=f30e738]: "!="
              - text: ","
              - code [ref=f30e739]: =~
              - text: ","
              - code [ref=f30e740]: "!~"
              - text: ) may also be used. The following expression selects all metrics that have a name starting with
              - code [ref=f30e741]: "job:"
              - text: ":"
            - code [ref=f30e743]: "{__name__=~\"job:.*\"}"
            - paragraph [ref=f30e744]:
              - text: The metric name must not be one of the keywords
              - code [ref=f30e745]: bool
              - text: ","
              - code [ref=f30e746]: "on"
              - text: ","
              - code [ref=f30e747]: ignoring
              - text: ","
              - code [ref=f30e748]: group_left
              - text: and
              - code [ref=f30e749]: group_right
              - text: ". The following expression is illegal:"
            - code [ref=f30e751]: "on{} # Bad!"
            - paragraph [ref=f30e752]:
              - text: A workaround for this restriction is to use the
              - code [ref=f30e753]: __name__
              - text: "label:"
            - code [ref=f30e755]: "{__name__=\"on\"} # Good!"
            - heading "Range Vector Selectors" [level=3] [ref=f30e756]:
              - text: Range Vector Selectors
              - link [ref=f30e757] [cursor=pointer]:
                - /url: "#range-vector-selectors"
            - paragraph [ref=f30e762]:
              - text: Range vector literals work like instant vector literals, except that they select a range of samples back from the current instant. Syntactically, a
              - link "float literal" [ref=f30e763] [cursor=pointer]:
                - /url: "#float-literals-and-time-durations"
              - text: is appended in square brackets (
              - code [ref=f30e764]: "[]"
              - text: ) at the end of a vector selector to specify for how many seconds back in time values should be fetched for each resulting range vector element. Commonly, the float literal uses the syntax with one or more time units, e.g.
              - code [ref=f30e765]: "[5m]"
              - text: . The range is a left-open and right-closed interval, i.e. samples with timestamps coinciding with the left boundary of the range are excluded from the selection, while samples coinciding with the right boundary of the range are included in the selection.
            - paragraph [ref=f30e766]:
              - text: In this example, we select all the values recorded less than 5m ago for all time series that have the metric name
              - code [ref=f30e767]: http_requests_total
              - text: and a
              - code [ref=f30e768]: job
              - text: label set to
              - code [ref=f30e769]: prometheus
              - text: ":"
            - code [ref=f30e771]: "http_requests_total{job=\"prometheus\"}[5m]"
            - heading "Offset modifier" [level=3] [ref=f30e772]:
              - text: Offset modifier
              - link [ref=f30e773] [cursor=pointer]:
                - /url: "#offset-modifier"
            - paragraph [ref=f30e778]:
              - text: The
              - code [ref=f30e779]: offset
              - text: modifier allows changing the time offset for individual instant and range vectors in a query.
            - paragraph [ref=f30e780]:
              - text: For example, the following expression returns the value of
              - code [ref=f30e781]: http_requests_total
              - text: "5 minutes in the past relative to the current query evaluation time:"
            - code [ref=f30e783]: http_requests_total offset 5m
            - paragraph [ref=f30e784]:
              - text: Note that the
              - code [ref=f30e785]: offset
              - text: "modifier always needs to follow the selector immediately, i.e. the following would be correct:"
            - code [ref=f30e787]: "sum(http_requests_total{method=\"GET\"} offset 5m) // GOOD."
            - paragraph [ref=f30e788]:
              - text: While the following would be
              - emphasis [ref=f30e789]: incorrect
              - text: ":"
            - code [ref=f30e791]: "sum(http_requests_total{method=\"GET\"}) offset 5m // INVALID."
            - paragraph [ref=f30e792]:
              - text: The same works for range vectors. This returns the 5-minute
              - link "rate" [ref=f30e793] [cursor=pointer]:
                - /url: /docs/prometheus/latest/querying/functions/#rate
              - text: that
              - code [ref=f30e794]: http_requests_total
              - text: "had a week ago:"
            - code [ref=f30e796]: rate(http_requests_total[5m] offset 1w)
            - paragraph [ref=f30e797]: "When querying for samples in the past, a negative offset will enable temporal comparisons forward in time:"
            - code [ref=f30e799]: rate(http_requests_total[5m] offset -1w)
            - paragraph [ref=f30e800]: Note that this allows a query to look ahead of its evaluation time.
            - heading "@ modifier" [level=3] [ref=f30e801]:
              - text: "@ modifier"
              - link [ref=f30e802] [cursor=pointer]:
                - /url: "#-modifier"
            - paragraph [ref=f30e807]:
              - text: The
              - code [ref=f30e808]: "@"
              - text: modifier allows changing the evaluation time for individual instant and range vectors in a query. The time supplied to the
              - code [ref=f30e809]: "@"
              - text: modifier is a Unix timestamp and described with a float literal.
            - paragraph [ref=f30e810]:
              - text: For example, the following expression returns the value of
              - code [ref=f30e811]: http_requests_total
              - text: at
              - code [ref=f30e812]: 2021-01-04T07:40:00+00:00
              - text: ":"
            - code [ref=f30e814]: http_requests_total @ 1609746000
            - paragraph [ref=f30e815]:
              - text: Note that the
              - code [ref=f30e816]: "@"
              - text: "modifier always needs to follow the selector immediately, i.e. the following would be correct:"
            - code [ref=f30e818]: "sum(http_requests_total{method=\"GET\"} @ 1609746000) // GOOD."
            - paragraph [ref=f30e819]:
              - text: While the following would be
              - emphasis [ref=f30e820]: incorrect
              - text: ":"
            - code [ref=f30e822]: "sum(http_requests_total{method=\"GET\"}) @ 1609746000 // INVALID."
            - paragraph [ref=f30e823]:
              - text: The same works for range vectors. This returns the 5-minute rate that
              - code [ref=f30e824]: http_requests_total
              - text: had at
              - code [ref=f30e825]: 2021-01-04T07:40:00+00:00
              - text: ":"
            - code [ref=f30e827]: rate(http_requests_total[5m] @ 1609746000)
            - paragraph [ref=f30e828]:
              - text: The
              - code [ref=f30e829]: "@"
              - text: modifier supports all representations of numeric literals described above. It works with the
              - code [ref=f30e830]: offset
              - text: modifier where the offset is applied relative to the
              - code [ref=f30e831]: "@"
              - text: modifier time. The results are the same irrespective of the order of the modifiers.
            - paragraph [ref=f30e832]: "For example, these two queries will produce the same result:"
            - code [ref=f30e834]: "# offset after @ http_requests_total @ 1609746000 offset 5m # offset before @ http_requests_total offset 5m @ 1609746000"
            - paragraph [ref=f30e835]:
              - text: Additionally,
              - code [ref=f30e836]: start()
              - text: and
              - code [ref=f30e837]: end()
              - text: can also be used as values for the
              - code [ref=f30e838]: "@"
              - text: modifier as special values.
            - paragraph [ref=f30e839]: For a range query, they resolve to the start and end of the range query respectively and remain the same for all steps.
            - paragraph [ref=f30e840]:
              - text: For an instant query,
              - code [ref=f30e841]: start()
              - text: and
              - code [ref=f30e842]: end()
              - text: both resolve to the evaluation time.
            - code [ref=f30e844]: http_requests_total @ start() rate(http_requests_total[5m] @ end())
            - paragraph [ref=f30e845]:
              - text: Note that the
              - code [ref=f30e846]: "@"
              - text: modifier allows a query to look ahead of its evaluation time.
            - heading "Subquery" [level=2] [ref=f30e847]:
              - text: Subquery
              - link [ref=f30e848] [cursor=pointer]:
                - /url: "#subquery"
            - paragraph [ref=f30e853]: Subquery allows you to run an instant query for a given range and resolution. The result of a subquery is a range vector.
            - paragraph [ref=f30e854]:
              - text: "Syntax:"
              - code [ref=f30e855]: <instant_query> '[' <range> ':' [<resolution>] ']' [ @ <float_literal> ] [ offset <float_literal> ]
            - list [ref=f30e856]:
              - listitem [ref=f30e857]:
                - code [ref=f30e858]: <resolution>
                - text: is optional. Default is the global evaluation interval.
            - heading "Operators" [level=2] [ref=f30e859]:
              - text: Operators
              - link [ref=f30e860] [cursor=pointer]:
                - /url: "#operators"
            - paragraph [ref=f30e865]:
              - text: Prometheus supports many binary and aggregation operators. These are described in detail in the
              - link "expression language operators" [ref=f30e866] [cursor=pointer]:
                - /url: /docs/prometheus/latest/querying/operators/
              - text: page.
            - heading "Functions" [level=2] [ref=f30e867]:
              - text: Functions
              - link [ref=f30e868] [cursor=pointer]:
                - /url: "#functions"
            - paragraph [ref=f30e873]:
              - text: Prometheus supports several functions to operate on data. These are described in detail in the
              - link "expression language functions" [ref=f30e874] [cursor=pointer]:
                - /url: /docs/prometheus/latest/querying/functions/
              - text: page.
            - heading "Comments" [level=2] [ref=f30e875]:
              - text: Comments
              - link [ref=f30e876] [cursor=pointer]:
                - /url: "#comments"
            - paragraph [ref=f30e881]:
              - text: PromQL supports line comments that start with
              - code [ref=f30e882]: "#"
              - text: ". Example:"
            - code [ref=f30e884]: "# This is a comment"
            - heading "Regular expressions" [level=2] [ref=f30e885]:
              - text: Regular expressions
              - link [ref=f30e886] [cursor=pointer]:
                - /url: "#regular-expressions"
            - paragraph [ref=f30e891]:
              - text: All regular expressions in Prometheus use
              - link "RE2 syntax" [ref=f30e892] [cursor=pointer]:
                - /url: https://github.com/google/re2/wiki/Syntax
              - text: .
            - paragraph [ref=f30e898]: Regex matches are always fully anchored.
            - heading "Gotchas" [level=2] [ref=f30e899]:
              - text: Gotchas
              - link [ref=f30e900] [cursor=pointer]:
                - /url: "#gotchas"
            - heading "Staleness" [level=3] [ref=f30e905]:
              - text: Staleness
              - link [ref=f30e906] [cursor=pointer]:
                - /url: "#staleness"
            - paragraph [ref=f30e911]:
              - text: The timestamps at which to sample data, during a query, are selected independently of the actual present time series data. This is mainly to support cases like aggregation (
              - code [ref=f30e912]: sum
              - text: ","
              - code [ref=f30e913]: avg
              - text: ", and so on), where multiple aggregated time series do not precisely align in time. Because of their independence, Prometheus needs to assign a value at those timestamps for each relevant time series. It does so by taking the newest sample that is less than the lookback period ago. The lookback period is 5 minutes by default, but can be"
              - link [ref=f30e914] [cursor=pointer]:
                - /url: /docs/prometheus/latest/command-line/prometheus/
                - text: set with the
                - code [ref=f30e915]: "--query.lookback-delta"
                - text: flag
              - text: or overridden on an individual query via the
              - code [ref=f30e916]: lookback_delta
              - text: parameter.
            - paragraph [ref=f30e917]: If a target scrape or rule evaluation no longer returns a sample for a time series that was previously present, this time series will be marked as stale. If a target is removed, the previously retrieved time series will be marked as stale soon after removal.
            - paragraph [ref=f30e918]: If a query is evaluated at a sampling timestamp after a time series is marked as stale, then no value is returned for that time series. If new samples are subsequently ingested for that time series, they will be returned as expected.
            - paragraph [ref=f30e919]: A time series will go stale when it is no longer exported, or the target no longer exists. Such time series will disappear from graphs at the times of their latest collected sample, and they will not be returned in queries after they are marked stale.
            - paragraph [ref=f30e920]:
              - text: "Some exporters, which put their own timestamps on samples, get a different behaviour: series that stop being exported take the last value for (by default) 5 minutes before disappearing. The"
              - code [ref=f30e921]: track_timestamps_staleness
              - text: setting can change this.
            - heading "Avoiding slow queries and overloads" [level=3] [ref=f30e922]:
              - text: Avoiding slow queries and overloads
              - link [ref=f30e923] [cursor=pointer]:
                - /url: "#avoiding-slow-queries-and-overloads"
            - paragraph [ref=f30e928]:
              - text: If a query needs to operate on a substantial amount of data, graphing it might time out or overload the server or browser. Thus, when constructing queries over unknown data, always start building the query in the tabular view of Prometheus's expression browser until the result set seems reasonable (hundreds, not thousands, of time series at most). Only when you have filtered or aggregated your data sufficiently, switch to graph mode. If the expression still takes too long to graph ad-hoc, pre-record it via a
              - link "recording rule" [ref=f30e929] [cursor=pointer]:
                - /url: /docs/prometheus/latest/configuration/recording_rules/#recording-rules
              - text: .
            - paragraph [ref=f30e930]:
              - text: This is especially relevant for Prometheus's query language, where a bare metric name selector like
              - code [ref=f30e931]: api_http_requests_total
              - text: could expand to thousands of time series with different labels. Also, keep in mind that expressions that aggregate over many time series will generate load on the server even if the output is only a small number of time series. This is similar to how it would be slow to sum all values of a column in a relational database, even if the output value is only a single number.
        - separator [ref=f30e932]
