            - generic [ref=f22e121]: Arbeitsgruppe 3.41
      - article [ref=f22e122]:
        - heading "Gasfeuchte" [level=2] [ref=f22e123]
        - paragraph [ref=f22e124]: Gasfeuchte bezeichnet den Wassergehalt in einem Gas. Die Feuchte wird dabei in verschiedenen Einheiten an- und weitergegeben, wie z.B. Tau/Frostpunkttemperatur, relative Feuchte oder Volumenanteil.
        - paragraph [ref=f22e125]:
          - text: Gemessen wird die Feuchte mit sogenannten Hygrometern, die nach unterschiedlichen Wirkprinzipien arbeiten. Eine Zusammenstellung wichtiger Arten von Hygrometern findet sich unter folgendem
          - link [ref=f22e126] [cursor=pointer]:
            - /url: https://www.ptb.de/cms/ptb/fachabteilungen/abt3/fb-34/ag-341/hygrometer-und-deren-wirkungsprinzipien-eine-uebersicht.html
            - img "Opens internal link in current window" [ref=f22e127]
            - text: Link
          - text: .
        - paragraph [ref=f22e128]:
          - text: Die Sicherung und Rückführung der Gasfeuchteskala erfolgt mit sog. Feuchtegeneratoren. Eine Auswahl der an der PTB eingesetzten Feuchtegeneratoren zur Rückführung der Messgröße Feuchte ist unter folgendem
          - link [ref=f22e129] [cursor=pointer]:
            - /url: https://www.ptb.de/cms/ptb/fachabteilungen/abt3/fb-34/ag-341/sicherung-und-rueckfuehrung-von-gasfeuchtemessungen.html
            - img "Opens internal link in current window" [ref=f22e130]
            - text: Link
          - text: gegeben.
        - paragraph
        - paragraph [ref=f22e131]
      - article [ref=f22e132]:
        - heading "Dienstleistungen" [level=2] [ref=f22e133]
        - paragraph [ref=f22e134]: Für die Hygrometer der unterschiedlichen Wirkprinzipien und eine Auswahl an kommerziellen Feuchtegeneratoren wird die messtechnische Rückführung auf das nationale Normal angeboten.
        - paragraph [ref=f22e135]:
          - link [ref=f22e136] [cursor=pointer]:
            - /url: https://www.ptb.de/cms/de/ptb/fachabteilungen/abt3/kalmess-3.html
            - img "Opens external link in new window" [ref=f22e137]
            - text: Kalibrier- und Messmöglichkeiten
        - paragraph [ref=f22e138]:
          - text: Anfragen zu
          - strong [ref=f22e139]: Kalibrierungen
          - text: sowie
          - strong [ref=f22e140]: Fragen rund um das Thema Gasfeuchte
          - text: richten Sie bitte an unsere E-Mail-Adresse
          - link [ref=f22e141] [cursor=pointer]:
            - /url: javascript:linkTo_UnCryptMailto('ocknvq,icuhgwejvgBrvd0fg');
            - img "Opens window for sending email" [ref=f22e142]
            - text: gasfeuchte(at)ptb.de
      - article [ref=f22e143]:
        - heading "Forschung und Entwicklung" [level=2] [ref=f22e144]
        - paragraph [ref=f22e145]: "Die Forschungs- und Entwicklungstätigkeiten im Bereich der Gasfeuchte erstrecken sich auf folgenden Themen:"
        - list [ref=f22e146]:
          - listitem [ref=f22e147]: Aufbau eines neuen Primärnormals für einen Frost/Taupunktbereich von -40°C bis +95°C
          - listitem [ref=f22e148]: Entwicklung von transportablen Gasfeuchtegeneratoren basierend auf dem Prinzip der Permeation
          - listitem [ref=f22e149]: Aktivitäten im Bereich der Spuren- und Hochfeuchte
          - listitem [ref=f22e150]: Aktivitäten im Bereich verschiedener Gasmatrizen, wie z.B. Energiegase oder Biogas
          - listitem [ref=f22e151]: Entwicklung und Einsatz feldgängiger Feuchtetransferstandards auf Basis der Laserspektroskopie (TDLAS)
          - listitem [ref=f22e152]: Rückführung atmosphärischer Feuchtemessungen auf Forschungsflugzeugen (HALO, Learjet etc.)
          - listitem [ref=f22e153]: Entwicklung und Einsatz schneller Laserhygrometer zur dynamischen Charakterisierung klassischer Hygrometer
      - article [ref=f22e154]:
        - heading "Gremien" [level=2] [ref=f22e155]
        - paragraph [ref=f22e156]: "Mitarbeit in folgenden Gremien:"
        - list [ref=f22e157]:
          - listitem [ref=f22e158]: DKD-Fachausschuss Temperatur und Feuchte
          - listitem [ref=f22e159]: VDI/VDE-GMA FA 2.53 Gasfeuchtemessung
          - listitem [ref=f22e160]: Technical Committee for Thermometry (EURAMET TC-T)
          - listitem [ref=f22e161]: Consultive Committee for Thermometry (CCT)
      - article [ref=f22e162]:
        - heading "Allgemeine Literatur Gasfeuchte" [level=2] [ref=f22e163]
        - list [ref=f22e164]:
          - listitem [ref=f22e165]: "Hardy, R.: ITS-90 Formulations for Vapor Pressure, Frostpoint Temperature, Dewpoint Temperature and Enhancement Factors in the Range -100 to 100 °C; Proceedings of Third International Symposium on Humidity and Moisture; edited by National Physical Laboratory (NPL), London, 1998, pp. 214-221."
          - listitem [ref=f22e166]: "Sonntag, D.: Important New Values of the Physical Constants of 1986, Vapor Pressure Formulations based on the ITS-90 and Psychrometer Formulae; Z. Meteorol., 70 (5), 1990, pp. 340-344."
          - listitem [ref=f22e167]: "Wexler, A.: Vapor Pressure Formulation for Water in Range 0 to 100 °C. A Revision; J. Research NBS, A. Physics and Chemistry, 80A, 1976, pp. 775-785."
          - listitem [ref=f22e168]: "Greenspan, L.: Functional Equations for Enhancement Factors for CO2-free Moist Air; J. Research NBS, A. Physics and Chemistry, 80A, 1976, pp. 41-44."
          - listitem [ref=f22e169]: "Harrison, L. P.: Fundamental Concepts and Definitions Relating to Humidity, in Wexler, A., Wildhack, W. A. (Eds.), Humidity and Moisture Vol. 3 Fundamentals and Standards, Reinhold Publishing, New York 1965, pp. 3-69."
