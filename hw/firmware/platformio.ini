; o2-probe Rev A firmware - STM32G071CBT7, Modbus RTU slave on the farm RS-485 bus.
;
; Two environments:
;   o2probe  cross build for the board (STM32Cube HAL + LL)
;   native   host build of the portable logic only, for `pio test -e native`
;
; The board is not in platform-ststm32, so boards/o2probe_g071cb.json defines it
; against the framework variant that already covers this exact die
; (STM32G0xx/G071C(6-8-B)(T-U)_G081CB(T-U)).

[platformio]
default_envs = o2probe

; TWO images share this part. `o2probe` is the application, linked into the
; 52 KiB run slot at 0x08004000; `loader` is the RS-485 bootloader, linked
; into the 16 KiB at 0x08000000. src/flash_map.h is the source of truth for
; both, and tools/check_flash_map.py fails the build if a linker script drifts
; from it.
;
; A bench board needs BOTH flashed. `pio run -e loader -t upload` writes the
; bootloader once; `pio run -t upload` writes the application afterwards.
; Uploading only the application leaves 0x08000000 erased and the part boots
; into nothing.

[env:o2probe]
platform = ststm32
board = o2probe_g071cb
framework = stm32cube
board_build.ldscript = ldscript/o2probe_app.ld
; The slot, not the part: a build that outgrows 52 KiB must fail here rather
; than link over the staging slot.
board_upload.maximum_size = 53248

; Regenerate-and-compare the hardware contract before every build. gen_sch.py is
; the schematic source of truth; if a divider or a pin moved under us, fail here
; rather than silently reporting rescaled telemetry. See tools/gen_hw_contract.py.
extra_scripts =
	pre:tools/pio_hw_contract.py
	pre:tools/pio_build_id.py
	post:tools/pio_image_check.py

build_flags =
	-std=gnu11
	-Os
	-ffunction-sections -fdata-sections
	; Without this, ld pulls the first PT_LOAD down to 0x08000000 so the ELF
	; headers can live at file offset 0 - page-offset congruence, maxpagesize
	; 0x10000. The segment then spans 0x08000000..0x0800a4f8, and `-t upload`
	; programs the ELF: 16 KiB of header and padding straight over the
	; BOOTLOADER, which verifies OK because that is what it was told to write.
	; The .bin is unaffected, which is why pio_image_check.py never saw it.
	; Measured before: PT_LOAD vaddr=0x08000000 filesz=0xa4f8.
	;          after:  PT_LOAD vaddr=0x08004000 filesz=0x64f8.
	-Wl,--nmagic
	-DHSE_VALUE=0                 ; no crystal is fitted: PF0/PF1 and PC14/PC15 are NC
	; The application does not start at the bottom of flash any more, so its
	; vector table is not where the core looks after reset. The bootloader
	; points VTOR here before it jumps; these two make SystemInit do it as
	; well, so an application started any other way is still correct.
	-DUSER_VECT_TAB_ADDRESS
	-DVECT_TAB_OFFSET=0x4000U
	; The membrane heater is compiled IN as of 2026-09-08, for the 80 C
	; harsh-environment characterisation. This only makes the ring REACHABLE;
	; it does not energise anything. Two further switches, both defaulting to
	; off and neither of them compile-time, still stand between this and any
	; current in the membrane: the HEATER_MAX_DUTY register (0x0035, default
	; zero) and, for open-loop bench use, the volatile arm register at 0x0060.
	-DO2P_HEATER_ENABLE=1
build_unflags = -std=gnu99

; Strict warnings apply to OUR sources only. ST's HAL/LL does not build clean
; under -Wextra (e.g. unused parameters in LL_*_DeInit), and relaxing the flag
; globally to accommodate a vendor tree would silently relax it for us too.
build_src_flags =
	-Wall -Wextra -Werror
	-Wdouble-promotion            ; a stray double on Cortex-M0+ is soft-float and slow

; The whole of src/ is portable-or-target, EXCEPT the two files of the
; bootloader and the two of the bench bridge: each pair carries a second
; main() and belongs to its own environment.
build_src_filter = +<*> -<loader_main.c> -<loader_uart.c> -<bridge_main.c> -<bridge_uart.c> -<bridge_reply.c> -<bridge_mailbox.c>

; The bench probe is a Seeed XIAO Debug Mate (ESP32-S3 running Seeed's DAPLink),
; which enumerates as a standard CMSIS-DAP adapter - VID 0x0D28 / PID 0x0204, an
; HID interface - so OpenOCD needs no adapter-specific configuration. An
; ST-LINK/V2 still works; switch both lines back to `stlink` for one. Verified
; against the first article 2026-09-01: attaches with SWDIO/SWCLK/GND only, no
; VTREF lead. `boards/o2probe_g071cb.json` already lists cmsis-dap as a
; supported protocol and names `stm32g0x` as the OpenOCD target.
upload_protocol = cmsis-dap
debug_tool = cmsis-dap

; The Rev A board has no USB and no serial console - RS-485 is the only channel.
; There is nothing to `monitor`; use a Modbus master instead.

; ---------------------------------------------------------------------------
; The RS-485 bootloader. 16 KiB at 0x08000000, flashed over SWD before potting
; and never rewritten in the field - it is the image that has to still work
; when the application does not. See src/loader_main.c.
;
; It links the update engine, the flash driver and the Modbus PDU layer that
; the application also uses, and NOTHING else from it: no register map, no
; sensor drivers, no heater. What the loader shares with the application is
; shared deliberately, file by file, in this list.
[env:loader]
platform = ${env:o2probe.platform}
board = ${env:o2probe.board}
framework = ${env:o2probe.framework}
board_build.ldscript = ldscript/o2probe_loader.ld
board_upload.maximum_size = 16384
extra_scripts = ${env:o2probe.extra_scripts}
upload_protocol = ${env:o2probe.upload_protocol}
debug_tool = ${env:o2probe.debug_tool}
build_unflags = ${env:o2probe.build_unflags}
build_flags =
	-std=gnu11
	-Os
	-ffunction-sections -fdata-sections
	-DHSE_VALUE=0
build_src_flags = ${env:o2probe.build_src_flags}
build_src_filter =
	+<loader_main.c>
	+<loader_uart.c>
	+<update.c>
	+<update_target.c>
	+<boot_desc.c>
	+<boot_shared.c>
	+<crc32.c>
	+<flash_hal.c>
	+<modbus_pdu.c>
	+<mcu.c>

; ---------------------------------------------------------------------------
; BENCH ADAPTER - NOT A PROBE. See src/bridge_main.c.
;
; A spare, UNPOTTED board flashed with this becomes the RS-485 adapter for the
; other ones: a 3.3 V USB-TTL lead on the J105/J106 lands (they were the R15/R16
; pads until 2026-09-05; see BOM-REDUCTION.md 3), the farm cable on J1,
; frames carried across verbatim. tools/o2p_update.py then runs against a real
; bus with no USB-RS485 dongle in the drawer.
;
; It links NEITHER the application nor the bootloader - no register map, no
; sensor drivers, no update engine, no flash writes of any kind. It cannot
; brick the probe on the other end of the cable because it does not know what
; is on the cable.
;
; It takes the whole 128 KiB and leaves nothing at 0x08004000, so a board that
; has been a bridge needs `-e loader` and then `-e o2probe` uploading again
; before it is a probe.
[env:bridge]
platform = ${env:o2probe.platform}
board = ${env:o2probe.board}
framework = ${env:o2probe.framework}
board_build.ldscript = ldscript/o2probe_bridge.ld
board_upload.maximum_size = 131072
extra_scripts = ${env:o2probe.extra_scripts}
upload_protocol = ${env:o2probe.upload_protocol}
debug_tool = ${env:o2probe.debug_tool}
build_unflags = ${env:o2probe.build_unflags}
build_flags =
	-std=gnu11
	-Os
	-ffunction-sections -fdata-sections
	-DHSE_VALUE=0
	; The farm cable's settings. Both sides default to these; raise only the
	; host side, and never lower it below the bus - src/bridge_main.c asserts it.
	; -DO2P_BRIDGE_HOST_BAUD=115200
build_src_flags = ${env:o2probe.build_src_flags}
build_src_filter =
	+<bridge_main.c>
	+<bridge_uart.c>
	+<bridge_reply.c>
	+<bridge_mailbox.c>
	+<modbus_pdu.c>
	+<mcu.c>
	; mcu.c's o2p_clock_init() parks the reset cause in the shared objects, so
	; the bridge has to link their definitions or it does not build at all.
	; Its SHARED sits in ordinary RAM rather than at 0x20000000, which MAILBOX
	; already owns - the bridge has no bootloader to hand anything to, so
	; nothing depends on the address, only on the symbols existing.
	+<boot_shared.c>

[env:native]
platform = native
build_flags =
	-std=gnu11
	-Wall -Wextra -Werror
	-DO2P_HOST_TEST=1
	; The control law is compiled for the host in BOTH configurations by the
	; tests; this default matches the target build.
	-DO2P_HEATER_ENABLE=0
	-I src
; Only the portable logic compiles on the host: no CMSIS, no LL, no registers.
build_src_filter =
	+<o2.c>
	+<psychro.c>
	+<config_migrate.c>
	+<modbus_pdu.c>
	+<bridge_reply.c>
	+<bridge_mailbox.c>
	+<regmap.c>
	+<faults.c>
	+<heater_ctl.c>
	+<crc32.c>
	+<update.c>
	+<boot_desc.c>
test_framework = unity
test_build_src = yes

; Compile-only proof that the heater path builds in its DISABLED
; configuration. The polarity of this env flipped on 2026-09-08 when the
; shipped build turned the heater on: its job is to keep the OTHER branch of
; every #if O2P_HEATER_ENABLE compiling, and that is now the off branch.
; Retaining the name would have been worse than renaming it - an env called
; _heater_enabled that builds the disabled path is a trap for the next reader.
[env:o2probe_heater_disabled]
platform = ${env:o2probe.platform}
board = ${env:o2probe.board}
framework = ${env:o2probe.framework}
board_build.ldscript = ${env:o2probe.board_build.ldscript}
board_upload.maximum_size = ${env:o2probe.board_upload.maximum_size}
extra_scripts = ${env:o2probe.extra_scripts}
; Inherited so this env can actually be FLASHED. It was written as a
; compile-only proof, and without these it falls back to the platform default
; (blackmagic) and fails at "open failed" - which is exactly what happens the
; first time anyone tries to run the heater bench procedure below.
upload_protocol = ${env:o2probe.upload_protocol}
debug_tool = ${env:o2probe.debug_tool}
build_unflags = ${env:o2probe.build_unflags} -DO2P_HEATER_ENABLE=1
build_flags = ${env:o2probe.build_flags} -DO2P_HEATER_ENABLE=0
build_src_flags = ${env:o2probe.build_src_flags}
build_src_filter = ${env:o2probe.build_src_filter}
