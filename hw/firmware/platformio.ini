; o2-probe Rev A firmware - STM32G071CBT7, Modbus RTU slave on the farm RS-485 bus.
;
; Two environments:
;   o2probe  cross build for the board (STM32Cube HAL + LL)
;   native   host build of the portable logic only, for `pio test -e native`
;
; The board is not in platform-ststm32, so boards/o2probe_g071cb.json defines it
; against the framework variant that already covers this exact die
; (STM32G0xx/G071C(6-8-B)(T-U)_G081CB(T-U)).

[platformio]
default_envs = o2probe

[env:o2probe]
platform = ststm32
board = o2probe_g071cb
framework = stm32cube

; Regenerate-and-compare the hardware contract before every build. gen_sch.py is
; the schematic source of truth; if a divider or a pin moved under us, fail here
; rather than silently reporting rescaled telemetry. See tools/gen_hw_contract.py.
extra_scripts = pre:tools/pio_hw_contract.py

build_flags =
	-std=gnu11
	-Os
	-ffunction-sections -fdata-sections
	-DHSE_VALUE=0                 ; no crystal is fitted: PF0/PF1 and PC14/PC15 are NC
	; The membrane heater is compiled OUT. Setting this to 1 energises 1 W into
	; a membrane carrier that sits against the electrochemical cell, so it is a
	; deliberate act with bench prerequisites - they are listed at the top of
	; src/heater.h and must all be met first. A second, independent switch is
	; the HEATER_MAX_DUTY register, which also defaults to zero.
	-DO2P_HEATER_ENABLE=0
build_unflags = -std=gnu99

; Strict warnings apply to OUR sources only. ST's HAL/LL does not build clean
; under -Wextra (e.g. unused parameters in LL_*_DeInit), and relaxing the flag
; globally to accommodate a vendor tree would silently relax it for us too.
build_src_flags =
	-Wall -Wextra -Werror
	-Wdouble-promotion            ; a stray double on Cortex-M0+ is soft-float and slow

; The whole of src/ is portable-or-target; nothing is excluded on target.
build_src_filter = +<*>

; The bench probe is a Seeed XIAO Debug Mate (ESP32-S3 running Seeed's DAPLink),
; which enumerates as a standard CMSIS-DAP adapter - VID 0x0D28 / PID 0x0204, an
; HID interface - so OpenOCD needs no adapter-specific configuration. An
; ST-LINK/V2 still works; switch both lines back to `stlink` for one. Verified
; against the first article 2026-09-01: attaches with SWDIO/SWCLK/GND only, no
; VTREF lead. `boards/o2probe_g071cb.json` already lists cmsis-dap as a
; supported protocol and names `stm32g0x` as the OpenOCD target.
upload_protocol = cmsis-dap
debug_tool = cmsis-dap

; The Rev A board has no USB and no serial console - RS-485 is the only channel.
; There is nothing to `monitor`; use a Modbus master instead.

[env:native]
platform = native
build_flags =
	-std=gnu11
	-Wall -Wextra -Werror
	-DO2P_HOST_TEST=1
	; The control law is compiled for the host in BOTH configurations by the
	; tests; this default matches the target build.
	-DO2P_HEATER_ENABLE=0
	-I src
; Only the portable logic compiles on the host: no CMSIS, no LL, no registers.
build_src_filter =
	+<o2.c>
	+<psychro.c>
	+<modbus_pdu.c>
	+<regmap.c>
	+<faults.c>
	+<heater_ctl.c>
test_framework = unity
test_build_src = yes

; Compile-only proof that the heater path builds in its ENABLED configuration.
; Nothing flashes this: it exists so that the code behind O2P_HEATER_ENABLE
; cannot rot while the shipped build has it switched off. A v1 that only
; compiles with the heater compiled out is not implemented.
[env:o2probe_heater_enabled]
platform = ${env:o2probe.platform}
board = ${env:o2probe.board}
framework = ${env:o2probe.framework}
extra_scripts = ${env:o2probe.extra_scripts}
build_unflags = ${env:o2probe.build_unflags} -DO2P_HEATER_ENABLE=0
build_flags = ${env:o2probe.build_flags} -DO2P_HEATER_ENABLE=1
build_src_flags = ${env:o2probe.build_src_flags}
build_src_filter = ${env:o2probe.build_src_filter}

; ---------------------------------------------------------------------------
; BENCH ONLY - NEVER DEPLOY, NEVER POT A PROBE RUNNING THIS.
;
; The first article's ADS1119 has two dead analog inputs, AIN1 (VREF monitor)
; and AIN3 (VIN monitor); a replacement part is on order. Both are diagnostic
; channels - AIN0, the oxygen measurement, is unaffected - so this build lets
; the cell work proceed by substituting a MANUALLY MEASURED reference for the
; one firmware can no longer read.
;
; O2P_BENCH_VREF_MV is the DMM reading at TP4, in millivolts. Re-measure and
; update it after ANY trim of RV1: firmware can no longer catch a drift, and
; the -600 mV cell bias is 24 % of this number. main.c rejects values outside
; 2400..2600 at compile time.
;
; VIN is published as the invalid sentinel here rather than the fabricated
; value AIN3 mirrors from AIN0. Watch the supply on the PSU instead.
; ---------------------------------------------------------------------------
[env:o2probe_bench]
platform = ${env:o2probe.platform}
board = ${env:o2probe.board}
framework = ${env:o2probe.framework}
extra_scripts = ${env:o2probe.extra_scripts}
upload_protocol = ${env:o2probe.upload_protocol}
debug_tool = ${env:o2probe.debug_tool}
build_unflags = ${env:o2probe.build_unflags}
build_flags = ${env:o2probe.build_flags} -DO2P_BENCH_VREF_MV=2505
build_src_flags = ${env:o2probe.build_src_flags}
build_src_filter = ${env:o2probe.build_src_filter}
